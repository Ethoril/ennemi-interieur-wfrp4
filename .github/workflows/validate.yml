name: Validate data

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  smoke-test:
    name: Smoke test (careers + skills cross-check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate careers.json
        run: node tools/smoke-test.mjs

  json-lint:
    name: JSON lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Parse careers.json
        run: node -e "JSON.parse(require('node:fs').readFileSync('js/data/careers.json','utf8'))"
      - name: Parse skills.json
        run: node -e "JSON.parse(require('node:fs').readFileSync('js/data/skills.json','utf8'))"

  version-coherence:
    name: Coherence version / cache / CHANGELOG
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verifier APP_VERSION, CACHE_NAME et CHANGELOG
        run: |
          node -e "
          const fs = require('node:fs');
          const rd = f => fs.readFileSync(f, 'utf8');
          const a = rd('js/layout.js').match(/APP_VERSION = '(.+?)'/)?.[1];
          const b = rd('sw.js').match(/APP_VERSION = '(.+?)'/)?.[1];
          if (!a || !b) { console.error('APP_VERSION introuvable'); process.exit(1); }
          if (a !== b) { console.error('layout.js ' + a + ' != sw.js ' + b); process.exit(1); }
          if (!rd('CHANGELOG.md').includes('[' + a.slice(1) + ']')) {
            console.error('CHANGELOG.md sans entree pour ' + a); process.exit(1);
          }
          console.log('Version coherente : ' + a);
          "

  syntaxe:
    name: Syntaxe des modules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: node --check sur tous les modules
        run: |
          set -e
          for f in js/*.js js/hero3d/*.js sw.js tools/*.mjs tools/lib/*.mjs; do
            node --check "$f"
          done

  fiche-domain:
    name: Synchronisation du domaine fiche
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - name: Installer les dépendances Functions
        run: npm ci --prefix functions
      - name: Vérifier les sources générées
        run: node tools/sync-fiche-domain.mjs --check
      - name: Tester le moteur et le contrôleur navigateur
        run: node --test tools/fiche-*.test.mjs tools/catalogue-*.test.mjs tools/j2-contribution-client.test.mjs tools/contributions-editor.test.mjs
      - name: Tester les callables et le domaine fiche
        run: npm --prefix functions test

  lint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint

  j2-emulators:
    name: Contributions J2 (émulateurs locaux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Installer les outils racine
        run: npm ci
      - name: Installer les dépendances Functions
        run: npm ci --prefix functions
      - name: Tester les règles J2 dans Firestore Emulator
        run: npm run test:j2-rules
      - name: Tester les services J2 avec Admin SDK dans Firestore Emulator
        run: npm run test:j2-services
