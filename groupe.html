<!DOCTYPE html>

    <meta property="og:description" content="Les personnages du groupe pour la campagne Warhammer Fantasy RPG — L'Ennemi Intérieur.">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Le Groupe — L'Ennemi Intérieur">
    <meta name="twitter:description" content="Les personnages du groupe pour la campagne Warhammer Fantasy RPG — L'Ennemi Intérieur.">
    <title>Le Groupe — L'Ennemi Intérieur</title>
    <meta name="description"
        content="Les personnages du groupe pour la campagne Warhammer Fantasy RPG — L'Ennemi Intérieur.">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Crimson+Text:ital,wght@0,400;0,600;0,700;1,400&display=swap">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/theme-parchment.css">

    <link rel="manifest" href="manifest.json">
</head>

<body>

    <!-- Navigation -->
    <a class="skip-link" href="#contenu">Aller au contenu</a>
    <nav class="navbar" id="navbar"></nav>

    <main class="page-container" id="contenu">

        <!-- Page Header -->
        <div class="page-header fade-in">
            <h1>Le Groupe</h1>
            <p>Les héros qui arpentent les routes dangereuses du Reikland.</p>
        </div>

        <!-- Character Grid -->
        <section class="section" style="padding-top: 0;">
            <div class="container">
                <div class="character-grid stagger-children">

                    <a href="fiche.html?char=bhelgi" class="character-link">
                        <div class="character-card" id="char-bhelgi">
                            <div class="character-portrait">
                                <img src="img/Bhelgi.webp" alt="Bhelgi" loading="lazy">
                            </div>
                            <div class="character-info">
                                <h3>Bhelgi</h3>
                            </div>
                        </div>
                    </a>

                    <a href="fiche.html?char=caelel" class="character-link">
                        <div class="character-card" id="char-caelel">
                            <div class="character-portrait">
                                <img src="img/Caelel.webp" alt="Caelel" loading="lazy">
                            </div>
                            <div class="character-info">
                                <h3>Caelel</h3>
                            </div>
                        </div>
                    </a>

                    <a href="fiche.html?char=elysia" class="character-link">
                        <div class="character-card" id="char-elysia">
                            <div class="character-portrait">
                                <img src="img/Elysia.webp" alt="Elysia" loading="lazy">
                            </div>
                            <div class="character-info">
                                <h3>Elysia</h3>
                            </div>
                        </div>
                    </a>

                    <a href="fiche.html?char=hellaya" class="character-link">
                        <div class="character-card" id="char-hellaya">
                            <div class="character-portrait">
                                <img src="img/Hellaya.webp" alt="Hellaya" loading="lazy">
                            </div>
                            <div class="character-info">
                                <h3>Hellaya</h3>
                            </div>
                        </div>
                    </a>

                    <a href="fiche.html?char=wren" class="character-link">
                        <div class="character-card" id="char-wren">
                            <div class="character-portrait">
                                <img src="img/Wren.webp" alt="Wren" loading="lazy">
                            </div>
                            <div class="character-info">
                                <h3>Wren</h3>
                            </div>
                        </div>
                    </a>

                    <a href="fiche.html?char=test" class="character-link">
                        <div class="character-card" id="char-fiche">
                            <div class="character-portrait character-portrait--placeholder">
                                📜
                            </div>
                            <div class="character-info">
                                <h3>Fiche HTML</h3>
                                <p class="char-subtitle">Sauvegardée dans le cloud</p>
                            </div>
                        </div>
                    </a>

                </div>
            </div>
        </section>

        <!-- Ornament -->
        <div class="ornament">⚜</div>

        <!-- Footer -->
        <footer class="footer" id="site-footer"></footer>

    </main>

    <script type="module" src="js/layout.js"></script>
    <script type="module" src="js/main.js"></script>
</body>

</html>
