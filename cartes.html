<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="robots" content="noindex, nofollow">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Cartes — L'Ennemi Intérieur">
    <meta property="og:description" content="Cartes du Vieux Monde pour la campagne Warhammer Fantasy RPG — L'Ennemi Intérieur.">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Cartes — L'Ennemi Intérieur">
    <meta name="twitter:description" content="Cartes du Vieux Monde pour la campagne Warhammer Fantasy RPG — L'Ennemi Intérieur.">
    <title>Cartes — L'Ennemi Intérieur</title>
    <meta name="description" content="Cartes du Vieux Monde pour la campagne Warhammer Fantasy RPG — L'Ennemi Intérieur.">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Crimson+Text:ital,wght@0,400;0,600;0,700;1,400&display=swap">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/theme-parchment.css">
    <link rel="manifest" href="manifest.json">
</head>

<body>

    <nav class="navbar" id="navbar"></nav>

    <div class="page-container">

        <!-- Page Header -->
        <div class="page-header fade-in">
            <h1>Cartes</h1>
            <p>Explore le Vieux Monde. Clique sur une carte pour l'ouvrir en visionneuse interactive.</p>
        </div>

        <!-- Map Grid -->
        <section class="section" style="padding-top: 0;">
            <div class="container">
                <div class="map-grid stagger-children">

                    <a href="carte.html?map=empire" class="map-card" id="map-empire">
                        <div class="map-thumbnail">
                            <img src="img/thumb-empire.webp" alt="Carte de l'Empire" loading="lazy">
                            <div class="map-zoom-btn">🔍</div>
                        </div>
                        <div class="map-info">
                            <h3>Carte de l'Empire</h3>
                            <p class="map-meta">Vue détaillée de l'Empire</p>
                        </div>
                    </a>

                    <a href="carte.html?map=vieux-monde" class="map-card" id="map-vieux-monde">
                        <div class="map-thumbnail">
                            <img src="img/thumb-vieux-monde.webp" alt="Carte du Vieux Monde" loading="lazy">
                            <div class="map-zoom-btn">🔍</div>
                        </div>
                        <div class="map-info">
                            <h3>Carte du Vieux Monde</h3>
                            <p class="map-meta">Vue d'ensemble du continent</p>
                        </div>
                    </a>

                </div>
            </div>
        </section>

        <!-- Ornament -->
        <div class="ornament">⚜</div>

        <footer class="footer" id="site-footer"></footer>

    </div>

    <script type="module" src="js/layout.js"></script>
    <script type="module" src="js/main.js"></script>
</body>

</html>
