<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>Mobile — note rapide en séance</title>
<!-- Maquette statique de référence (390×844). Couleurs en dur : le code réel utilise les variables de css/base.css (voir ../README.md, § Jetons). -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&amp;family=Crimson+Text:ital,wght@0,400;0,600;1,400&amp;display=swap">
<style>
body{margin:0;background:#07070d}
.link{flex-shrink:0;display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px;border-radius:18px;border:1px solid rgba(201,168,76,.28);background:transparent;color:#cbbfa8;font:500 15px 'Crimson Text',serif}
.link.on{background:rgba(201,168,76,.18);border-color:#c9a84c;color:#f0e6d3}
</style>
</head>
<body>
<div style="width:390px;height:844px;box-sizing:border-box;display:flex;flex-direction:column;background:#07070d;color:#e8dcc8;font-family:'Crimson Text',Georgia,serif;position:relative;overflow:hidden">
  <div aria-hidden="true" style="flex:1;padding:80px 16px;display:flex;flex-direction:column;gap:12px;opacity:.35">
    <span style="font:700 22px Cinzel,serif">Qui finance la Main Pourpre ?</span>
    <span style="height:70px;background:#e6d7b5;border-radius:3px"></span>
    <span style="height:70px;background:#e6d7b5;border-radius:3px"></span>
  </div>
  <div aria-hidden="true" style="position:absolute;inset:0;background:rgba(3,3,8,.6)"></div>

  <section role="dialog" aria-labelledby="h-note" style="position:absolute;left:0;right:0;bottom:0;height:560px;border-radius:18px 18px 0 0;background:#141422;border-top:1px solid rgba(201,168,76,.35);padding:10px 16px 16px;box-sizing:border-box;display:flex;flex-direction:column;gap:14px;box-shadow:0 -12px 30px rgba(0,0,0,.6)">
    <span aria-hidden="true" style="align-self:center;width:40px;height:4px;border-radius:2px;background:rgba(201,168,76,.35)"></span>
    <div style="display:flex;align-items:center;gap:8px">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#c9a84c" stroke-width="2" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>
      <h2 id="h-note" style="margin:0;font:700 17px Cinzel,serif;color:#f0e6d3">Note rapide</h2>
      <span style="font-size:14px;color:#8f846f">· mon carnet</span>
      <a href="04-mobile-dossier.html" style="margin-left:auto;font-size:15px;color:#a89b84;text-decoration:none;padding:10px 4px">Fermer</a>
    </div>
    <label for="note" style="position:absolute;left:-9999px">Texte de la note</label>
    <textarea id="note" style="flex:1;resize:none;border-radius:10px;border:1px solid rgba(201,168,76,.3);background:#0e0e18;color:#e8dcc8;padding:14px;font:18px/1.5 'Crimson Text',serif;outline:none">Le batelier parle d’un entrepôt près du pont aux Trois Écus.</textarea>
    <div style="display:flex;flex-direction:column;gap:8px">
      <span style="font:600 11px Cinzel,serif;letter-spacing:.14em;color:#a89b84">RELIER À</span>
      <div style="display:flex;flex-wrap:wrap;gap:6px">
        <button class="link on" aria-pressed="true">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" aria-hidden="true"><path d="m5 12 5 5 9-10"></path></svg>Qui finance la Main Pourpre ?</button>
        <button class="link" aria-pressed="false">Johannes Teugen</button>
        <button class="link" aria-pressed="false">Pièce n° 1</button>
        <button class="link" aria-pressed="false">Autre…</button>
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:12px">
      <span role="status" style="font-size:14px;color:#8f846f">Brouillon gardé sur ce téléphone</span>
      <button style="margin-left:auto;height:50px;padding:0 26px;border-radius:25px;border:0;background:#c9a84c;color:#1a1408;font:700 17px 'Crimson Text',serif">Noter</button>
    </div>
  </section>
</div>
</body>
</html>
