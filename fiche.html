<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.gstatic.com https://apis.google.com https://www.google.com https://*.firebaseapp.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://*.googleusercontent.com; frame-src https://*.firebaseapp.com https://*.google.com https://accounts.google.com; connect-src 'self' https://docs.google.com https://*.googleapis.com https://*.firebaseapp.com https://apis.google.com https://www.gstatic.com https://www.google.com/recaptcha/ https://europe-west1-campagne-wrpg.cloudfunctions.net">
    <meta name="robots" content="noindex, nofollow">
    <meta name="description" content="Fiche de personnage interactive sauvegardée dans le cloud pour la campagne Warhammer Fantasy RPG — L'Ennemi Intérieur.">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Fiche de Personnage — L'Ennemi Intérieur">
    <meta property="og:description" content="Fiche de personnage interactive sauvegardée dans le cloud pour la campagne Warhammer Fantasy RPG — L'Ennemi Intérieur.">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Fiche de Personnage — L'Ennemi Intérieur">
    <meta name="twitter:description" content="Fiche de personnage interactive sauvegardée dans le cloud pour la campagne Warhammer Fantasy RPG — L'Ennemi Intérieur.">
    <title>Fiche de Personnage — L'Ennemi Intérieur</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Crimson+Text:ital,wght@0,400;0,600;0,700;1,400&display=swap">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/theme-parchment.css">
    <link rel="stylesheet" href="css/fiche-bureau.css">
    <link rel="stylesheet" href="css/equipment.css">
    <link rel="stylesheet" href="css/career-viewer.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#07070d">
    <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
</head>

<body>
  <a class="skip-link" href="#contenu">Aller au contenu</a>
  <nav class="navbar" id="navbar"></nav>
  <main class="bureau" id="contenu">
    <a id="fiche-mobile-return" href="app/index.html#/fiches" hidden>‹ Retour à l’application mobile</a>
    <div class="bureau-session"><div id="fiche-session"></div><button id="bureau-logout" type="button" hidden>Déconnexion</button></div>
    <section id="bureau-wall" class="bureau-card"><h1>Fiche de personnage</h1><p id="bureau-wall-message">Connexion requise pour accéder à la fiche.</p><button id="bureau-login" type="button">Connexion Google</button></section>
    <div id="bureau-content" hidden>
      <header id="bureau-header" class="bureau-card bureau-header"></header>
      <div class="bureau-grid">
        <div class="bureau-left" id="bureau-left"></div>
        <div class="bureau-center">
          <section class="bureau-card" aria-labelledby="skills-title">
            <h2 id="skills-title">Compétences</h2>
            <div class="bureau-filters"><label>Rechercher <input id="skill-query" type="search" placeholder="Nom d’une compétence…" autocomplete="off"></label><label>Afficher <select id="skill-filter"><option value="all">Toutes</option><option value="career">Carrière</option><option value="trained">Entraînées</option></select></label></div>
            <div id="bureau-skills"></div>
            <button type="button" data-action="search" data-kind="skill">+ Apprendre une compétence avancée</button>
          </section>
          <section class="bureau-card" aria-labelledby="talents-title"><h2 id="talents-title">Talents</h2><div id="bureau-talents"></div><button type="button" data-action="search" data-kind="talent">+ Talent hors carrière</button></section>
          <section class="bureau-card" aria-labelledby="spells-title"><h2 id="spells-title">Sorts et miracles</h2><div id="bureau-spells"></div><div class="bureau-actions"><button type="button" data-action="search" data-kind="sort">+ Apprendre un sort</button><button type="button" data-action="search" data-kind="miracle">+ Apprendre un miracle</button></div></section>
          <div class="bureau-card" id="bureau-weapons"></div>
          <div class="bureau-card" id="bureau-armours"></div>
        </div>
        <aside class="bureau-rail" aria-label="Carrière et détail"><p id="bureau-status" role="status" aria-live="polite" aria-atomic="true"></p><div id="bureau-inspector" class="bureau-card"></div><div id="bureau-recent" class="bureau-card"></div></aside>
        <section id="journal" class="bureau-card bureau-journal" aria-labelledby="journal-title"><h2 id="journal-title">Journal d’expérience</h2><div id="bureau-journal"></div><div id="bureau-corrections"></div></section>
      </div>
    </div>
    <div id="career-viewer-host"></div>
    <button id="btn-import-fiche" type="button" hidden>Importer</button>
    <input id="bureau-import" type="file" accept=".json,application/json" hidden>
    <footer class="footer" id="site-footer"></footer>
  </main>
  <script type="module" src="js/layout.js"></script>
  <script type="module" src="js/main.js"></script>
  <script type="module" src="js/fiche-bureau/app.js"></script>
</body>
</html>
