<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hors ligne — L'Ennemi Intérieur</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #07070d;
      color: #e7e1d5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Georgia, serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      line-height: 1.6;
    }
    .card {
      background: #141422;
      border: 1px solid #c9a84c;
      border-radius: 8px;
      padding: 40px 32px;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
    }
    .icon {
      font-size: 3rem;
      margin-bottom: 16px;
      display: block;
    }
    h1 {
      color: #c9a84c;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 1.8rem;
      letter-spacing: 0.05em;
      margin-bottom: 16px;
    }
    p {
      color: #b0a898;
      font-size: 1rem;
      margin-bottom: 24px;
    }
    .hint {
      color: #807868;
      font-size: 0.85rem;
      margin-bottom: 28px;
      border-top: 1px solid #2a2a3e;
      padding-top: 16px;
    }
    .btn {
      display: inline-block;
      background: #c9a84c;
      color: #07070d;
      font-weight: bold;
      font-size: 0.95rem;
      padding: 12px 28px;
      border-radius: 4px;
      border: none;
      cursor: pointer;
      text-decoration: none;
      letter-spacing: 0.05em;
      transition: background 0.2s, transform 0.1s;
    }
    .btn:hover {
      background: #e4c76b;
    }
    .btn:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>
  <div class="card">
    <span class="icon" aria-hidden="true">⚔️</span>
    <h1>Hors Ligne</h1>
    <p>Cette page n'a pas encore été mise en cache et votre connexion réseau est actuellement indisponible.</p>
    <p class="hint">Les pages et aides de jeu déjà consultées restent accessibles hors ligne.</p>
    <button class="btn" onclick="window.location.reload()">Réessayer</button>
  </div>
</body>
</html>
