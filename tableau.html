<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://docs.google.com">
    <meta name="robots" content="noindex, nofollow">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Aides de Jeux — L'Ennemi Intérieur">
    <meta property="og:description" content="Aides de jeux pour la campagne Warhammer Fantasy RPG — L'Ennemi Intérieur.">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Aides de Jeux — L'Ennemi Intérieur">
    <meta name="twitter:description" content="Aides de jeux pour la campagne Warhammer Fantasy RPG — L'Ennemi Intérieur.">
    <title>Aides de Jeux — L'Ennemi Intérieur</title>
    <meta name="description" content="Aides de jeux pour la campagne Warhammer Fantasy RPG — L'Ennemi Intérieur.">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Crimson+Text:ital,wght@0,400;0,600;0,700;1,400&display=swap">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/theme-parchment.css">
    <link rel="manifest" href="manifest.json">
</head>

<body>

    <!-- Navigation -->
    <a class="skip-link" href="#contenu">Aller au contenu</a>
    <nav class="navbar" id="navbar"></nav>

    <main class="page-container" id="contenu">

        <!-- Page Header -->
        <div class="page-header fade-in">
            <h1>Aides de Jeux</h1>
            <p>Tu peux naviguer entre les onglets pour accéder aux sorts, aux miracles, aux armes, aux mots clés, etc.
            </p>
        </div>

        <!-- Dynamic Sheet Content -->
        <section class="section" style="padding-top: 0;">
            <div class="container">

                <!-- Open in Google Sheets link -->
                <div style="text-align: center; margin-bottom: var(--space-md);" class="fade-in">
                    <a href="#" class="sheet-open-btn" id="sheet-link" target="_blank" rel="noopener noreferrer">
                        📎 Ouvrir dans Google Sheets (idéal sur PC)
                    </a>
                </div>

                <!-- Toolbar: Tabs + Search -->
                <div class="sheet-toolbar fade-in">
                    <div class="sheet-tabs" id="sheet-tabs"></div>
                    <div class="sheet-search-wrapper">
                        <span class="sheet-search-icon">🔍</span>
                        <input type="text" class="sheet-search" id="sheet-search"
                            placeholder="Rechercher un sort, une arme, un mot clé...">
                    </div>
                </div>

                <!-- Loading -->
                <div class="sheet-loading" id="sheet-loading">
                    <div class="sheet-spinner"></div>
                    Chargement des données...
                </div>

                <!-- Data Container -->
                <div class="sheet-content" id="sheet-content"></div>



            </div>
        </section>

        <!-- Ornament -->
        <div class="ornament">⚜</div>

        <!-- Footer -->
        <footer class="footer" id="site-footer"></footer>

    </main>

    <script type="module" src="js/layout.js"></script>
    <script type="module" src="js/main.js"></script>
    <script type="module" src="js/sheets.js"></script>
</body>

</html>
